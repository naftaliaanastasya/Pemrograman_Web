<!DOCTYPE html>
<html lang="id">
<head>

<title>Happy Hamburger</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

<style>

        font-family: 'Roboto', sans-serif;
        text-align: center;
        background: #eee;
    }

    h1 {
        font-size: 3em;
        background: #F09C1D;
        padding: 10px;
    }

    .wrap {
        display: flex;
        justify-content: center;
        gap: 40px;
        margin-top: 30px;
    }

    table {
        border-collapse: collapse;
    }

    td {
        width: 30px;
        height: 30px;
    }

    .box {
        background: #F09C1D;
        padding: 20px;
        border-radius: 10px;
        color: white;
        text-align: left;

</style>
</head>
