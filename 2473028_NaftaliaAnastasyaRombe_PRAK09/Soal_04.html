<!DOCTYPE html>
<html>
    <head>
        <title>Naftalia Anastasya Rombe-2473028</title>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        
        <style>
            body{
                font-family: Arial, sans-serif;
                background:#f4f4f4;
                display:flex;
                justify-content:center;
                align-items:center;
                height:100vh;
            }

            .box{
                background:white;
                padding:25px;
                border-radius:10px;
                box-shadow:0 0 10px rgba(0,0,0,0.2);
            }

            td{
                text-align:center;
            }

        </style>
    </head>
    
    <body>
        <div class="box">
            <table border="1" cellpadding="0" cellspacing="0">
                <tr>
                    <td width="50" align="center">
                        <input class="header" type="checkbox"><br>
                        <hr>

                        <input class="body" type="checkbox"><br><br>
                        <input class="body" type="checkbox"><br><br>
                        <input class="body" type="checkbox"><br><br>
                        <input class="body" type="checkbox"><br><br>
                        <input class="body" type="checkbox"><br>
                    </td>
                </tr>
            </table>
        </div>
        
        <script>

            $(".header").click(function(){

                var flag = $(this).attr("checked");

                if(flag){

                    $("input:checkbox.body").removeAttr("checked");

                    $(this).removeAttr("checked");

                }else{

                    $("input:checkbox.body").attr("checked","checked");

                    $(this).attr("checked","checked");
                }

            });


            $(".body").click(function(){

                if($(this).attr("checked")){

                    $(this).removeAttr("checked");

                }else{

                    $(this).attr("checked","checked");
                }

            });
        </script>
    </body>
</html>
